function showNotice(t){notice=t;render();setTimeout(()=>{if(notice===t){notice='';render()}},4200)}
function savePrefs(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function sound(freq=520,dur=.07,kind='sine'){if(!settings.sound)return;try{const ctx=window.__audioctx||(window.__audioctx=new(window.AudioContext||window.webkitAudioContext)());const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.stop(ctx.currentTime+dur+.02)}catch{}}
function uid(){return crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now().toString(36)}
function newCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';for(let i=0;i<5;i++)x+=alphabet[Math.floor(Math.random()*alphabet.length)];return x}
function cleanText(s,limit=140){return String(s??'').replace(/[\x00-\x1f\x7f]/g,' ').replace(/\s+/g,' ').trim().slice(0,limit)}
function cleanName(s){return cleanText(s,19)||'Guest'}
function isConnected(p){return p.connected}
function activePlayers(){return h.players.filter(p=>p.connected)}
function selectJudge(){const pool=activePlayers().filter(p=>p.id!==h.previousJudge);return pick(pool.length?pool:activePlayers()).id}
const INTRO='<span class="tag">THE RULES ARE SIMPLE. THE ANSWERS ARE NOT.</span>';
function brand(){return `<div class="brand" data-act="brand"><span class="brandicon">✦</span> OFFBEAT<span style="color:#7395af">.</span></div>`}
function topBar(){let desc=hosted&&h?`HOST · ${roomCode}`:roomCode?`ROOM · ${roomCode}`:'THE PARTY GAME';return `<header class="topbar">${brand()}<span class="badge"><span class="dot"></span>${htmlEscape(desc)}</span></header>`}
function footer(){return `<footer class="footer"><span>OFFBEAT / MADE FOR THE UNEXPECTED</span><span>${page==='home'?'3–20 players · 30-second turns':roomCode?'Keep this tab open during a match':'One good card changes everything.'}</span></footer>`}
function home(){return `<main class="hero"><div><div class="eyebrow">✳ A PARTY GAME OF STRANGE IDEAS</div><h1>Think<br><span>sideways.</span></h1><p class="lede">Make your friends laugh, impress a random judge, and defend your most questionable card choices. No two rounds feel the same.</p><div class="heroactions"><button class="button blue" data-act="play" style="padding:16px 29px">Play with friends <span>→</span></button><button class="button soft" data-act="settings">⚙ Settings</button></div><p class="sm muted" style="margin-top:21px">3–20 players · Private room codes · No account required</p></div><div class="hero-demo"><div class="demo-card"><span class="stamp">THE PROMPT</span><strong>What ruined the school assembly?</strong><span class="flair">✳</span></div><div class="demo-card"><span class="stamp">YOUR ANSWER</span><strong>A very serious duck.</strong><span class="flair">✦</span></div></div></main>`}
function choose(){return `<div class="central"><section class="dialog pop"><div class="tag">WELCOME TO THE TABLE</div><h2>How are we playing?</h2><p class="muted sm">Pick a room to play with friends. One person hosts, and everyone else joins with the code.</p><div class="choice-stack"><button class="action-choice" data-act="host-flow"><div class="action-ico">⌂</div><div><b>Host a room</b><span>Create a new private lobby and start the match.</span></div><span style="margin-left:auto">→</span></button><button class="action-choice" data-act="join-flow"><div class="action-ico">⌗</div><div><b>Join with a code</b><span>Enter the five-character code from your friend.</span></div><span style="margin-left:auto">→</span></button></div><button class="button ghost" style="margin-top:20px" data-act="home">← Back</button></section></div>`}
function nameForm(){return `<div class="central"><section class="dialog pop"><div class="tag">${entryKind==='host'?'CREATE ROOM':'JOIN ROOM'}</div><h2>${entryKind==='host'?'Your table awaits.':'Almost there.'}</h2><p class="muted sm">${entryKind==='host'?'Choose a name. We’ll give you a room code to share.':'Enter the code and the name your friends will see.'}</p>${entryKind==='join'?`<label class="label">ROOM CODE</label><input class="input" id="room-input" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABCDE" value="${htmlEscape(pendingCode)}" style="font-weight:900;letter-spacing:5px;text-transform:uppercase">`:''}<label class="label">DISPLAY NAME</label><input class="input" id="name-input" maxlength="19" autocomplete="off" placeholder="e.g. MidnightPigeon" value="${htmlEscape(nameDraft)}"><button class="button blue full" style="margin-top:21px" data-act="connect">${entryKind==='host'?'Create room':'Join room'} →</button>${issue?`<p class="alert">${htmlEscape(issue)}</p>`:''}<button class="button ghost" style="margin-top:10px" data-act="play">← Go back</button></section></div>`}
function connecting(){return `<div class="central"><section class="dialog" style="text-align:center"><div style="font-size:48px;margin-bottom:10px">◌</div><h2>Connecting the room…</h2><p class="muted sm">${htmlEscape(issue||'Using a shared browser connection service. This may take a moment.')}</p><button class="button soft" data-act="cancel">Cancel</button></section></div>`}
function settingsScreen(){return `<div class="central"><section class="dialog wide pop"><div class="tag">MAKE IT YOURS</div><h2>Settings</h2><div class="settingsrow"><div><b>Sound effects</b><div class="sm muted">Soft clicks, celebrations, and little flourishes.</div></div><button class="toggle ${settings.sound?'on':''}" aria-label="Toggle sound" data-act="pref-sound"></button></div><div class="settingsrow"><div><b>Reduced animations</b><div class="sm muted">Keep interface motion minimal.</div></div><button class="toggle ${!settings.motion?'on':''}" aria-label="Toggle reduced motion" data-act="pref-motion"></button></div><div class="settingsrow"><div><b>Experimental online AI</b><div class="sm muted" style="max-width:510px">Off by default. When enabled, tries a public third-party text service; your prompt is sent there. This service may stop working, require payment, or rate-limit. A built-in free generator is always available as fallback.</div></div><button class="toggle ${settings.remoteAI?'on':''}" aria-label="Toggle experimental AI" data-act="pref-ai"></button></div><div style="background:#edf3f8;border-radius:13px;padding:16px;margin:20px 0 0" class="sm muted"><b style="color:var(--ink)">How online play works</b><br>Only the host controls the match. Players connect browser-to-browser through PeerJS signaling. Everyone needs internet and the host must keep their tab open. Some school Wi‑Fi blocks WebRTC. <b>AI is not required to play.</b></div><button class="button soft" style="margin-top:20px" data-act="home">← Back to menu</button></section></div>`}
function playerChip(p){return `<div class="player-pill"><div class="avatar" style="background:${['#dde8f4','#eae4f3','#e3edf0','#f2e6db','#e9eddf'][Math.abs(hash(p.id))%5]}">${htmlEscape((p.name||'?')[0].toUpperCase())}</div><div style="min-width:0"><strong>${htmlEscape(p.name)}${p.id===me?' (you)':''}</strong><span>${p.host?'Host · ':''}${p.connected?'Ready to play':'Disconnected'}</span></div>${p.connected?'<span style="margin-left:auto;color:#64ab96">●</span>':'<span style="margin-left:auto;color:#c18e88">○</span>'}</div>`}
function hash(v){let h=0;for(let i=0;i<v.length;i++)h=(h*31+v.charCodeAt(i))|0;return h}
function lobby(){let s=snap;if(!s)return connecting();return `<div class="lobby card pop"><div class="lobbyhead"><div><div class="tag">YOUR PRIVATE ROOM</div><h2>The lobby.</h2><p class="sm muted" style="max-width:470px">Invite at least three players. Every round has a new randomly selected judge. The host starts the game when everyone is ready.</p></div><div><div class="tag" style="margin-bottom:10px">ROOM CODE · CLICK TO COPY</div><button class="roomcode" data-act="copycode" title="Copy room code">${htmlEscape(roomCode)} ⧉</button></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:27px"><h3>Players in room</h3><span class="badge">${s.players.filter(p=>p.connected).length} / 20</span></div><div class="players">${s.players.map(playerChip).join('')}</div><div class="lobbyfoot"><button class="button danger small" data-act="leave">Leave room</button><div style="display:flex;align-items:center;gap:15px"><span class="muted sm">${s.players.filter(p=>p.connected).length<3?'Waiting for 3 players…':'Ready when you are.'}</span>${s.hostId===me?`<button class="button blue" data-act="start" ${s.players.filter(p=>p.connected).length<3?'disabled':''}>Start game →</button>`:'<span class="badge">Waiting for host</span>'}</div></div></div>`}
function clock(){return `<div class="clock"><div class="clock-ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" stroke="#e4eaf0" stroke-width="5" fill="none"/><circle id="clock-progress" cx="40" cy="40" r="34" stroke="#729eb7" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="213.628" stroke-dashoffset="0"/></svg><div class="clock-num" id="clock-number">30</div></div><small id="clock-caption">SECONDS LEFT</small></div>`}
function card(text,kind='answer',opts={}){let symbol=kind==='prompt'?'✳':'◈';return `<button class="pick-card ${kind}" data-act="${opts.act||'noop'}" ${opts.data||''} ${opts.disabled?'disabled':''}><span class="tiny">${kind==='prompt'?'PROMPT CARD':'ANSWER CARD'} ${opts.number||''}</span><strong>${htmlEscape(text)}</strong><span class="symbol">${symbol}</span></button>`}
function aiCard(role){return `<button class="pick-card utility ai" data-act="${role==='prompt'?'ai-prompt':'ai-answer'}" ${aiWorking?'disabled':''}><span class="tiny">THE WILDCARD</span><strong>Generate something unexpected</strong><span class="symbol">✳</span></button>`}
function customCard(role){return `<button class="pick-card utility custom" data-act="${role==='prompt'?'custom-prompt':'custom-answer'}"><span class="tiny">YOUR OWN IDEA</span><strong>Write your own ${role==='prompt'?'prompt':'answer'}</strong><span class="symbol">✎</span></button>`}
function phaseHeading(title,desc){return `<div class="arena-center"><div class="tag">ROUND ${snap.round} / ${htmlEscape(snap.stage)}</div><h2>${title}</h2><p>${desc}</p></div>`}
function waits(){return `<div class="waiting-list">${snap.players.filter(p=>p.id!==snap.judgeId&&p.connected).map(p=>`<span class="wait-chip ${snap.submitted.includes(p.id)?'done':''}">${htmlEscape(p.name)} ${snap.submitted.includes(p.id)?'✓':'…'}</span>`).join('')}</div>`}
function contentPrompt(){if(snap.judgeId===me){return `${phaseHeading('You set the tone.','Pick one prompt, write your own, or take a chance on a generated card.') }<div class="cards">${snap.promptOptions.map((x,i)=>card(x.text,'prompt',{act:'choose-prompt',data:`data-index="${i}"`,number:'#'+(i+1)})).join('')}${aiCard('prompt')}${customCard('prompt')}</div>`}return `${phaseHeading(`${htmlEscape(snap.judgeName)} is choosing…`,'Three random prompts, one wild idea, or something custom.')}<div class="statusbox">✳ The judge is choosing this round’s prompt.</div><div style="margin:auto;text-align:center;color:#9ab0c0;font-size:80px">◈</div>`}
function contentSubmit(){let p=snap.chosenPrompt||'Something mysterious';let mine=snap.submitted.includes(me);if(snap.judgeId===me)return `${phaseHeading('The cards are coming in.','You will choose the best anonymous answer after everyone submits.')}<div class="big-prompt"><span class="tiny">YOUR PROMPT</span><strong>${htmlEscape(p)}</strong></div>${waits()}<div class="statusbox">Answers remain anonymous until after the vote.</div>`;return `${phaseHeading(mine?'Card locked in.':'Play your best card.',mine?'Your answer is secret until the big reveal.':'Pick one of five cards, generate an idea, or write your own.') }<div class="big-prompt"><span class="tiny">THE JUDGE ASKS</span><strong>${htmlEscape(p)}</strong></div>${mine?`<div class="statusbox">✓ Submitted. Waiting for everyone else to finish.</div>${waits()}`:`<div class="cards hand">${snap.hand.map((c,i)=>card(c.text,'answer',{act:'choose-answer',data:`data-id="${htmlEscape(c.id)}"`,number:'#'+(i+1)})).join('')}${aiCard('answer')}${customCard('answer')}</div>`}`}
function contentReview(){let isJudge=snap.judgeId===me;return `${phaseHeading(isJudge?'Pick the winning answer.':'The judge decides.',isJudge?'Submissions are shuffled. No names until the reveal.':'Every submitted answer appears anonymously; the judge picks one winner.') }<div class="big-prompt"><span class="tiny">THE PROMPT</span><strong>${htmlEscape(snap.chosenPrompt)}</strong></div><div class="submissions">${snap.submissions.map((c,i)=>card(c.text,'answer',{act:isJudge?'choose-winner':'noop',data:`data-sid="${htmlEscape(c.sid)}"`,number:'#'+(i+1),disabled:!isJudge})).join('')}</div>`}
function chat(){let messages=snap?.chat||[];return `<div class="chat"><div class="tag">THE AFTERPARTY CHAT · OPEN NOW</div><div class="chat-log" id="chat-log">${messages.length?messages.map(m=>`<div class="chat-line"><b>${htmlEscape(m.name)}:</b> ${htmlEscape(m.text)}</div>`).join(''):'<div class="small-msg">Say something nice. Or defend your terrible card choice.</div>'}</div><form class="chat-entry" id="chat-form"><input autocomplete="off" id="chat-text" maxlength="180" placeholder="Say something…"><button class="button blue small" type="submit">Send ↗</button></form></div>`}
function contentReveal(){let w=snap.winner||{name:'Nobody',text:'No answer was selected.'};return `${phaseHeading('The verdict is in.','One point awarded. The rest is for bragging rights.') }<div class="duo"><div class="reveal-card"><span class="tiny">THE PROMPT</span><b>${htmlEscape(snap.chosenPrompt)}</b><span class="tiny">✳ QUESTION</span></div><div class="reveal-card winner"><span class="tiny">THE WINNING CARD · +1 POINT</span><b>${htmlEscape(w.text)}</b><span class="winner-name">✦ ${htmlEscape(w.name)}</span></div></div>${chat()}`}
function sortedScores(){return snap.players.slice().sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}
function leaderboard(){return `<div class="leaderboard">${sortedScores().map((p,i)=>`<div class="leaderrow ${p.id===me?'me':''}"><span class="rank">${String(i+1).padStart(2,'0')}</span><strong>${htmlEscape(p.name)} ${p.id===me?'· you':''}</strong><span class="score">${p.score} <span class="sm muted" style="font-weight:600">pts</span></span></div>`).join('')}</div>`}
function contentScore(){return `${phaseHeading('The standings.','Every round brings a new judge and a fresh chance.')}${leaderboard()}<div class="small-msg">Another round begins automatically.</div>`}
function finalScreen(){let leaders=sortedScores(),positions=[leaders[1],leaders[0],leaders[2]],medals=['🥈','🥇','🥉'];return `<div class="arena pop"><div class="final-heading"><div class="tag">THE FINAL VERDICT</div><h2>That's a wrap.</h2><p class="muted sm">${htmlEscape(snap.finishReason||'Everybody voted to end the game.')} · ${snap.round} rounds</p></div><div class="podium">${positions.map((p,i)=>`<div class="podium-place ${i===1?'first':''}"><div class="medal">${medals[i]}</div><strong>${p?htmlEscape(p.name):'—'}</strong><small>${p?p.score+' points':'No player'}</small></div>`).join('')}</div>${leaderboard()}${chat()}<div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><button class="button blue" data-act="leave">Leave room →</button></div></div>`}
function gameScreen(){if(!snap)return connecting();if(snap.phase==='final')return finalScreen();let stage=snap.phase;let subtitles={prompt:'PICK A PROMPT',submit:'PLAY A CARD',review:'CHOOSE A WINNER',reveal:'THE REVEAL',score:'SCOREBOARD'};let local=snap.players.find(p=>p.id===me)||{score:0};let content={prompt:contentPrompt,submit:contentSubmit,review:contentReview,reveal:contentReveal,score:contentScore}[stage];return `<div class="room-game"><div class="game-head"><div><div class="phase-label">${subtitles[stage]||'IN SESSION'} · ${htmlEscape(roomCode)}</div><div class="roundlabel">ROUND ${snap.round} <span class="muted sm">/ ∞</span></div></div>${clock()}<div class="score-mini"><small>YOUR SCORE</small><strong>${local.score}</strong></div></div><div class="arena pop" id="arena">${content?content():''}</div><div class="game-foot"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="button danger small" data-act="vote">${snap.players.find(p=>p.id===me)?.vote?'✓ Cancel end vote':'◉ Vote to end game'}</button><span class="vote-state">${snap.players.filter(p=>p.connected&&p.vote).length} / ${snap.players.filter(p=>p.connected).length} voted</span></div><span class="sm muted">${snap.phase==='prompt'?'The judge can finish early.':snap.phase==='submit'?'Moves stay hidden until reveal.':'Your vote carries to the next round.'}</span></div></div>`}
function modalHtml(){if(!modal)return '';let isPrompt=modal==='custom-prompt';return `<div class="modalback"><div class="modal"><div class="tag">${isPrompt?'YOUR QUESTION':'YOUR ANSWER'}</div><h2>Make it yours.</h2><p class="sm muted">${isPrompt?'Write a short, funny prompt. Use ____ for a fill-in-the-blank, or ask a question.':'Write the card you wish you had been dealt.'}</p><form id="custom-form"><textarea class="input" id="custom-text" maxlength="140" rows="3" placeholder="${isPrompt?'The most unusual thing at school today was ____.' :'A robot trying to order soup.'}" autofocus required></textarea><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button type="button" class="button soft" data-act="close-modal">Cancel</button><button class="button blue" type="submit">Play this card →</button></div></form></div></div>`}
function render(){document.body.style.setProperty('scroll-behavior','auto');let main=({home,choose,form:nameForm,connecting,settings:settingsScreen,lobby,game:gameScreen}[page]||home)();app.innerHTML=`<div class="shell">${topBar()}${main}${footer()}</div>${notice?`<div style="position:fixed;right:18px;bottom:18px;background:#2c506e;color:white;padding:15px 20px;border-radius:14px;box-shadow:var(--shadow);z-index:20;font-size:13px">${htmlEscape(notice)}</div>`:''}${modalHtml()}`;updateClock();if((page==='game'&&snap&&(snap.phase==='reveal'||snap.phase==='final'))){const el=$('chat-log');if(el)el.scrollTop=el.scrollHeight}}
function setPage(p){page=p;render()}
function updateClock(){if(page!=='game'||!snap)return;let n=$('clock-number'),c=$('clock-caption'),bar=$('clock-progress');if(!n)return;let total=({prompt:30,submit:30,review:30,reveal:15,score:10}[snap.phase]||30);let time=snap.paused?snap.remain:Math.max(0,(snap.deadline+clockOffset()-Date.now())/1000);if(snap.phase==='final')time=0;time=Math.max(0,Math.min(total,time));n.textContent=Math.ceil(time);c.textContent=snap.paused?'WAITING FOR AI':'SECONDS LEFT';bar.setAttribute('stroke-dashoffset',String(213.628*(1-time/total)));bar.style.stroke=time<6?'#df9387':'#729eb7'}
function clockOffset(){return snap?.clockSync?.offset||0}
/* -------------------- DECK / GAME AUTHORITY -------------------- */
function createHost(){h={players:[],phase:'lobby',round:0,judgeId:'',previousJudge:'',hostId:me,chosenPrompt:'',promptOptions:[],submissions:[],winner:null,deadline:0,remain:0,paused:false,aiPending:{},aiUsed:{},chat:[],finishReason:'',usedPrompts:new Set(),usedAnswers:new Set()};addPlayer(me,cleanName(nameDraft),true);hostTimer=setInterval(hostTick,170)}
function addPlayer(id,name,host=false){if(!h||h.players.some(p=>p.id===id))return;h.players.push({id,name,host,connected:true,score:0,vote:false,hand:Array.from({length:5},drawAnswer),selected:false,usedCard:null,lastChat:0});}
function drawAnswer(){if(!h)return {id:uid(),text:pick(BANK.answers)};for(let i=0;i<60;i++){let id=Math.floor(Math.random()*BANK.answers.length);if(!h.usedAnswers.has(id)){h.usedAnswers.add(id);if(h.usedAnswers.size>BANK.answers.length*.85)h.usedAnswers.clear();return {id:`c${id}`,text:BANK.answers[id]}}}let i=Math.floor(Math.random()*BANK.answers.length);return{id:`c${i}`,text:BANK.answers[i]}}
function drawPrompt(){for(let i=0;i<40;i++){let idx=Math.floor(Math.random()*BANK.prompts.length);if(!h.usedPrompts.has(idx)){h.usedPrompts.add(idx);if(h.usedPrompts.size>BANK.prompts.length*.9)h.usedPrompts.clear();return {id:`p${idx}`,text:BANK.prompts[idx]}}}let id=Math.floor(Math.random()*BANK.prompts.length);return{id:`p${id}`,text:BANK.prompts[id]}}
function phaseTo(stage,duration){h.phase=stage;h.deadline=Date.now()+duration*1000;h.remain=duration;h.paused=false;h.aiPending={};h.aiUsed={};broadcast()}
function nextRound(){if(!h||h.phase==='final')return;const people=activePlayers();if(people.length<3){finishGame('The match ended when fewer than three players remained.');return}h.round++;h.previousJudge=h.judgeId;h.judgeId=selectJudge();h.chosenPrompt='';h.promptOptions=[drawPrompt(),drawPrompt(),drawPrompt()];h.submissions=[];h.winner=null;h.chat=[];for(const p of h.players){p.selected=false;p.vote=!!p.vote;p.usedCard=null;}phaseTo('prompt',30)}
function startGame(){if(!h||h.phase!=='lobby'||activePlayers().length<3||activePlayers().length>20)return;nextRound()}
function selectPrompt(txt){if(!h||h.phase!=='prompt')return;h.chosenPrompt=cleanText(txt,140);phaseTo('submit',30)}
function submitAnswer(p,text,usedCard=null){if(!h||h.phase!=='submit'||p.id===h.judgeId||p.selected)return false;let txt=cleanText(text,140);if(!txt)return false;p.selected=true;p.usedCard=usedCard;h.submissions.push({sid:uid().slice(0,10),playerId:p.id,text:txt});broadcast();if(activePlayers().filter(x=>x.id!==h.judgeId).every(x=>x.selected))startReview();return true}
function startReview(){if(!h||h.phase!=='submit')return;for(const p of activePlayers()){if(p.id!==h.judgeId&&!p.selected){let card=pick(p.hand);p.selected=true;p.usedCard=card.id;h.submissions.push({sid:uid().slice(0,10),playerId:p.id,text:card.text})}}for(let i=h.submissions.length-1;i>0;i--){let k=Math.floor(Math.random()*(i+1));[h.submissions[k],h.submissions[i]]=[h.submissions[i],h.submissions[k]]}phaseTo('review',30)}
function judgePick(sid){if(!h||h.phase!=='review')return;const choice=h.submissions.find(x=>x.sid===sid);if(!choice)return;let person=h.players.find(x=>x.id===choice.playerId);if(!person)return;person.score+=1;h.winner={id:person.id,name:person.name,text:choice.text};for(const p of h.players){if(p.usedCard){let ix=p.hand.findIndex(c=>c.id===p.usedCard);if(ix!==-1)p.hand[ix]=drawAnswer()}}phaseTo('reveal',15);sound(830,.25)}
function finishGame(reason){if(!h||h.phase==='final')return;h.finishReason=reason||'All players voted to end the game.';phaseTo('final',0)}
function hostTick(){if(!h||['lobby','final'].includes(h.phase))return;if(h.paused){let now=Date.now();let keys=Object.keys(h.aiPending);for(const key of keys)if(now-h.aiPending[key]>34000)delete h.aiPending[key];if(!Object.keys(h.aiPending).length){h.paused=false;h.deadline=Date.now()+h.remain*1000;broadcast()}return}if(Date.now()<h.deadline)return;const stage=h.phase;if(stage==='prompt')selectPrompt(pick(h.promptOptions).text);else if(stage==='submit')startReview();else if(stage==='review'){if(h.submissions.length)judgePick(pick(h.submissions).sid);else finishGame('No cards could be submitted.')}else if(stage==='reveal')phaseTo('score',10);else if(stage==='score')nextRound()}
function endIfAllVoted(){if(h&&h.phase!=='lobby'&&h.phase!=='final'&&activePlayers().length>=3&&activePlayers().every(p=>p.vote))finishGame('Everyone voted to finish the match.')}
function hostAction(sender,op,payload={}){if(!h)return;const p=h.players.find(x=>x.id===sender);if(!p||!p.connected)return;const stage=h.phase;if(op==='start'&&sender===h.hostId){startGame();return}
 if(op==='vote'&&stage!=='lobby'&&stage!=='final'){p.vote=!p.vote;endIfAllVoted();broadcast();return}
 if(op==='prompt'&&stage==='prompt'&&sender===h.judgeId&&!h.aiPending[sender]){const chosen=h.promptOptions.find(x=>x.id===payload.id);if(chosen)selectPrompt(chosen.text);else if(payload.custom){const t=cleanText(payload.custom,140);if(t.length>=5)selectPrompt(t)}return}
 if(op==='answer'&&stage==='submit'&&sender!==h.judgeId&&!h.aiPending[sender]){if(payload.id){let chosen=p.hand.find(x=>x.id===payload.id);if(chosen)submitAnswer(p,chosen.text,chosen.id)}else if(payload.custom){let t=cleanText(payload.custom,140);if(t.length>=2)submitAnswer(p,t)}return}
 if(op==='winner'&&stage==='review'&&sender===h.judgeId&&!h.paused){judgePick(String(payload.sid));return}
 if(op==='aiBegin'&&(stage==='prompt'&&sender===h.judgeId||stage==='submit'&&sender!==h.judgeId&&!p.selected)){if(h.aiUsed[sender]||h.aiPending[sender])return;h.aiUsed[sender]=true;h.aiPending[sender]=Date.now();if(!h.paused){h.remain=Math.max(0,(h.deadline-Date.now())/1000);h.paused=true}broadcast();return}
 if(op==='aiFinish'&&h.aiPending[sender]){delete h.aiPending[sender];if(!Object.keys(h.aiPending).length){h.paused=false;h.deadline=Date.now()+h.remain*1000}let t=cleanText(payload.text,140);if(stage==='prompt'&&sender===h.judgeId){selectPrompt(t.length>=5?t:pick(h.promptOptions).text)}else if(stage==='submit'&&sender!==h.judgeId){submitAnswer(p,t||pick(p.hand).text)}broadcast();return}
 if(op==='chat'&&['reveal','final'].includes(stage)){let now=Date.now();if(now-p.lastChat<680)return;let t=cleanText(payload.text,180);if(!t)return;p.lastChat=now;h.chat.push({id:uid(),name:p.name,text:t});h.chat=h.chat.slice(-25);broadcast();return}
}
function snapshotFor(id){const p=h.players.find(x=>x.id===id);const stage=h.phase;return {phase:stage,round:h.round,judgeId:h.judgeId,judgeName:h.players.find(x=>x.id===h.judgeId)?.name||'',hostId:h.hostId,chosenPrompt:h.chosenPrompt,promptOptions:stage==='prompt'&&id===h.judgeId?h.promptOptions:[],hand:p?.hand||[],submissions:stage==='review'?h.submissions.map(x=>({sid:x.sid,text:x.text})):[],submitted:h.players.filter(x=>x.selected).map(x=>x.id),players:h.players.map(x=>({id:x.id,name:x.name,score:x.score,connected:x.connected,host:x.host,vote:x.vote})),winner:h.winner?{name:h.winner.name,text:h.winner.text}:null,chat:['reveal','final'].includes(stage)?h.chat:[],deadline:h.deadline,remain:h.remain,paused:h.paused,finishReason:h.finishReason,hostTimestamp:Date.now(),stage:{prompt:'JUDGE',submit:'ANSWERS',review:'VOTE',reveal:'REVEAL',score:'STANDINGS',final:'FINAL'}[stage]||'LOBBY'}}
function broadcast(){if(!h)return;let sent=Date.now();for(const p of h.players){const s=snapshotFor(p.id);if(p.id===me){receiveSnapshot(s,me,sent);continue}const c=connections.get(p.id);if(c?.open){try{c.send({type:'snapshot',self:p.id,s,hostTime:sent})}catch(e){log(e)}}}}
function receiveSnapshot(s,self,hostTime){me=self;const local=Date.now();snap={...s,clockSync:{local,offset:local-hostTime}};roomCode=roomCode||pendingCode;const next=s.phase==='lobby'?'lobby':'game';if(page!==next){page=next;modal=''}render()}
/* -------------------- CONNECTIONS -------------------- */
function cleanup(){clearTimeout(connectingTimer);if(hostTimer)clearInterval(hostTimer);hostTimer=null;h=null;connections.forEach(c=>{try{c.close()}catch{}});connections.clear();if(conn){try{conn.close()}catch{}}conn=null;if(peer){try{peer.destroy()}catch{}}peer=null;hosted=false;snap=null;me='';roomCode='';pendingCode='';modal='';aiWorking=false}
function exitRoom(){cleanup();issue='';page='home';render()}
function peerUnavailable(){issue='Cannot load the multiplayer connection library. Connect to the internet, or try another network. On some school Chromebooks this service is blocked.';page='form';render()}
function errorMsg(s){issue=s;page='form';render()}
function createPeer(id){return id?new Peer(id,{debug:0}):new Peer({debug:0})}
function hostRoom(){if(!window.Peer)return peerUnavailable();cleanup();hosted=true;nameDraft=cleanName(nameDraft);roomCode=newCode();setPage('connecting');let attempts=0;function attempt(){attempts++;roomCode=attempts>1?newCode():roomCode;const intended=roomCode;let p;try{p=createPeer('offbeat-rps-'+intended.toLowerCase())}catch(e){errorMsg('Unable to start WebRTC in this browser.');return}peer=p;let ready=false;const watchdog=setTimeout(()=>{if(!ready&&peer===p){try{p.destroy()}catch{};errorMsg('The connection service did not respond. Check internet and try again.')}},14500);p.on('open',id=>{if(peer!==p)return;ready=true;clearTimeout(watchdog);me=id;createHost();page='lobby';broadcast()});p.on('connection',connection=>{connections.set(connection.peer,connection);connection.on('data',msg=>{if(!msg||typeof msg!=='object')return;if(msg.type==='hello'){if(h.phase!=='lobby'){connection.send({type:'reject',reason:'This match has already started. Ask the host to create a new room.'});return}if(activePlayers().length>=20){connection.send({type:'reject',reason:'Room is full (20 players).'});return}if(h.players.some(x=>x.id===connection.peer))return;addPlayer(connection.peer,cleanName(msg.name),false);connection.send({type:'welcome',self:connection.peer,code:roomCode});broadcast()}else if(msg.type==='action'){hostAction(connection.peer,msg.op,msg.payload||{})}});connection.on('close',()=>remoteLeft(connection.peer));connection.on('error',()=>remoteLeft(connection.peer))});p.on('error',e=>{clearTimeout(watchdog);if(peer!==p)return;if(e.type==='unavailable-id'&&attempts<4){p.destroy();attempt();return}errorMsg('Unable to host: '+(e.type==='network'?'network or signaling error.':String(e.type||'unknown error')))});p.on('disconnected',()=>showNotice('Signaling disconnected. Existing players may remain connected.'))}attempt()}
function remoteLeft(id){let p=h?.players.find(x=>x.id===id);if(!p||!p.connected)return;p.connected=false;connections.delete(id);if(h.aiPending[id]){delete h.aiPending[id];if(h.paused&&!Object.keys(h.aiPending).length){h.paused=false;h.deadline=Date.now()+h.remain*1000}}if(h.phase==='lobby'){h.players=h.players.filter(x=>x.id!==id)}else if(h.phase!=='final'){if(activePlayers().length<3){finishGame('The match ended because fewer than three players remained.')}else if(h.phase==='submit'&&activePlayers().filter(x=>x.id!==h.judgeId).every(x=>x.selected))startReview();else if(id===h.judgeId){if(h.phase==='prompt')selectPrompt(pick(h.promptOptions).text);else if(h.phase==='review'&&h.submissions.length)judgePick(pick(h.submissions).sid)}endIfAllVoted()}broadcast()}
function joinRoom(){if(!window.Peer)return peerUnavailable();const code=pendingCode.toUpperCase().trim();if(!/^[A-HJ-NP-Z2-9]{5}$/.test(code)){issue='Enter a valid five-character room code.';render();return}cleanup();hosted=false;pendingCode=code;roomCode=code;setPage('connecting');let p;try{p=createPeer()}catch(e){errorMsg('Unable to use WebRTC on this device.');return}peer=p;connectingTimer=setTimeout(()=>{if(page==='connecting'){cleanup();errorMsg('Connection timed out. Verify the room code and that the host is still online.')}},18000);p.on('open',id=>{if(peer!==p)return;me=id;let c=p.connect('offbeat-rps-'+code.toLowerCase(),{reliable:true,serialization:'json'});conn=c;c.on('open',()=>{c.send({type:'hello',name:cleanName(nameDraft)})});c.on('data',msg=>{if(!msg||!msg.type)return;if(msg.type==='reject'){clearTimeout(connectingTimer);cleanup();errorMsg(msg.reason)}else if(msg.type==='welcome'){clearTimeout(connectingTimer);me=msg.self}else if(msg.type==='snapshot'){clearTimeout(connectingTimer);receiveSnapshot(msg.s,msg.self,msg.hostTime)}});c.on('close',()=>{if(page==='connecting'||page==='game'||page==='lobby'){cleanup();page='home';showNotice('Disconnected from host. Host must keep their tab open.')}});c.on('error',()=>{if(page==='connecting'){cleanup();errorMsg('Could not reach this host. Check the code and internet connection.')}})});p.on('error',e=>{if(page==='connecting'){cleanup();errorMsg(e.type==='peer-unavailable'?'Room not found. Check the code.':'Connection error: '+String(e.type||'unknown'))}})}
function sendAction(op,payload={}){if(hosted){hostAction(me,op,payload)}else if(conn?.open){conn.send({type:'action',op,payload})}}
function onChooseCard(type,raw){sound(660,.11);if(type==='prompt'){let card=snap?.promptOptions?.[Number(raw)];if(card)sendAction('prompt',{id:card.id})}else if(type==='answer'){sendAction('answer',{id:raw})}}
/* -------------------- AI OPTIONS -------------------- */
const AI_PROMPTS=["What secret does the city's last vending machine know?","What would be the worst possible invention for a science fair?","Why did the entire marching band disappear?","The last message from the moon simply said ____.","What's the real reason your phone battery is always low?","The world's most confusing new holiday celebrates ____.","What would make a perfectly ordinary Tuesday legendary?","The new president of the snack aisle promises ____.","What shouldn't exist in a museum of the future?","The mysterious radio broadcast was interrupted by ____.","An unreasonably dramatic documentary about ____.","What's the most suspicious thing to find in a time capsule?","The next groundbreaking scientific discovery is ____.","What could bring an entire alien council to tears?","The secret weapon of the world's most boring superhero is ____." ];
const AI_CONCEPTS=['a suspiciously musical traffic cone','a self-aware school locker','a goldfish who gives financial advice','a retro arcade hidden under the cafeteria','a tiny moon that follows people home','a secret meeting of exhausted robots','an extremely shy vending machine','a legendary sandwich that only appears at midnight','the sound of twelve printers starting at once','a squeaky wheel with its own fan club','a pigeon with a master plan','a haunted slideshow presentation','an inflatable cactus with diplomatic status','a fridge that keeps writing poetry','an overly theatrical automatic door','a robot who refuses to learn percentages','a town-wide conspiracy about pencils','a very serious raccoon in a necktie'];
function generateLocal(kind,context){if(kind==='prompt'){return pick(AI_PROMPTS)}const q=String(context||'').toLowerCase();let opt=AI_CONCEPTS.slice();if(/space|moon|planet|alien|astronaut|star/.test(q))opt.push('a confused astronaut in a cardboard spaceship','a very small galaxy in a lunchbox','a cosmic pigeon with a parking ticket');if(/school|class|teacher|test|cafeteria|bus/.test(q))opt.push('a substitute teacher who is clearly three raccoons','a homework assignment written by a toaster','a bus that only stops for applause');if(/city|traffic|street|car|parking/.test(q))opt.push('a self-driving shopping cart with a police escort','a bus stop that predicts the future');if(/phone|internet|robot|computer|ai|app/.test(q))opt.push('an AI that insists every answer is soup','a computer mouse with a secret identity','an app that rates the quality of clouds');return (Math.random()<.3?pick(['Somehow, ','Against all odds, ','As foretold by the prophecy: ','Nobody expected ']):'')+pick(opt)}
async function generateRemote(kind,context){let question=kind==='prompt'?'Write ONE funny original family-friendly open-ended party-game prompt, playful and weird, max 100 characters. Return ONLY the single prompt sentence, no quotation marks.':`Write ONE surprising, funny, original family-friendly response card for this party game prompt: ${context}. Max 100 characters, answer as a short noun phrase. Return ONLY the card text, no quotes.`;const controller=new AbortController();let timer=setTimeout(()=>controller.abort(),12500);try{const resp=await fetch('https://text.pollinations.ai/'+encodeURIComponent(question),{signal:controller.signal,cache:'no-store'});if(!resp.ok)throw new Error('Service unavailable');let t=cleanText(await resp.text(),125).replace(/^['"“”]+|['"“”]+$/g,'');if(!t||t.length<4||/error|quota|rate limit|unauthorized/i.test(t))throw new Error('Unexpected response');return t}catch(e){log('Optional online AI unavailable; built-in generator used.',e.message);return generateLocal(kind,context)}finally{clearTimeout(timer)}}
async function startAI(kind){if(aiBusyLocal)return;aiBusyLocal=true;aiWorking=true;sendAction('aiBegin');showNotice('Generating a card… the round timer is paused.');let text=generateLocal(kind,snap?.chosenPrompt);if(settings.remoteAI){text=await generateRemote(kind,snap?.chosenPrompt)}sendAction('aiFinish',{text});aiWorking=false;aiBusyLocal=false}
/* -------------------- UI EVENTS -------------------- */
app.addEventListener('click',async e=>{let button=e.target.closest('[data-act]');if(!button||button.disabled)return;let action=button.dataset.act;sound(480,.045);if(action==='brand'){if(!roomCode)setPage('home');return}if(action==='home'||action==='cancel'){if(page==='connecting')cleanup();issue='';setPage('home');return}if(action==='play'){issue='';setPage('choose');return}if(action==='settings'){setPage('settings');return}if(action==='pref-sound'){settings.sound=!settings.sound;savePrefs();render();return}if(action==='pref-motion'){settings.motion=!settings.motion;savePrefs();document.documentElement.style.setProperty('scroll-behavior',settings.motion?'auto':'auto');render();return}if(action==='pref-ai'){settings.remoteAI=!settings.remoteAI;savePrefs();render();return}if(action==='host-flow'||action==='join-flow'){entryKind=action==='host-flow'?'host':'join';issue='';setPage('form');setTimeout(()=>$('name-input')?.focus(),40);return}if(action==='connect'){nameDraft=cleanName($('name-input')?.value);if(entryKind==='join')pendingCode=String($('room-input')?.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');entryKind==='host'?hostRoom():joinRoom();return}if(action==='copycode'){try{await navigator.clipboard.writeText(roomCode);showNotice('Room code copied!')}catch{showNotice('Room code: '+roomCode)}return}if(action==='start'){sendAction('start');return}if(action==='leave'){exitRoom();return}if(action==='vote'){sendAction('vote');return}if(action==='choose-prompt'){onChooseCard('prompt',button.dataset.index);return}if(action==='choose-answer'){onChooseCard('answer',button.dataset.id);return}if(action==='choose-winner'){sendAction('winner',{sid:button.dataset.sid});return}if(action==='custom-prompt'||action==='custom-answer'){modal=action;render();setTimeout(()=>$('custom-text')?.focus(),20);return}if(action==='close-modal'){modal='';render();return}if(action==='ai-prompt'||action==='ai-answer'){startAI(action==='ai-prompt'?'prompt':'answer');return}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='custom-form'){let t=cleanText($('custom-text')?.value,140);if(t.length<(modal==='custom-prompt'?5:2))return;sendAction(modal==='custom-prompt'?'prompt':'answer',{custom:t});modal='';render()}else if(e.target.id==='chat-form'){let t=cleanText($('chat-text')?.value,180);if(t)sendAction('chat',{text:t});const box=$('chat-text');if(box)box.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render()}else if(e.key==='Enter'&&page==='form'&&document.activeElement?.tagName==='INPUT'){e.preventDefault();app.querySelector('[data-act="connect"]')?.click()}else if(e.key==='Enter'&&page==='game'&&snap?.phase==='final'&&document.activeElement?.tagName!=='INPUT'){exitRoom()}});
window.addEventListener('beforeunload',()=>{try{if(hosted&&h){for(const c of connections.values()){if(c.open)c.send({type:'reject',reason:'The host closed the room.'})}}}catch{}});
setInterval(updateClock,100);render();
</script></body></html>
